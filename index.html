<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile</title>

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
    }

    /* HEADER */
    .top-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 25px;
      z-index: 1000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .logo {
      color: white;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .header-icons i {
      color: white;
      font-size: 22px;
      margin-left: 15px;
      cursor: pointer;
      transition: 0.3s;
    }

    .header-icons i:hover {
      transform: scale(1.1);
      color: #ffe082;
    }

    /* SIDEBAR */
    .sidebar {
      position: fixed;
      top: 70px;
      left: 0;
      width: 240px;
      height: 100%;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      padding-top: 20px;
      box-shadow: 4px 0 10px rgba(0,0,0,0.1);
    }

    .sidebar ul {
      list-style: none;
    }

    .sidebar ul li {
      padding: 16px 25px;
      transition: 0.3s;
    }

    .sidebar ul li:hover {
      background: rgba(255,255,255,0.2);
      border-left: 4px solid white;
    }

    .sidebar ul li a {
      text-decoration: none;
      color: white;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 16px;
    }

    /* MAIN CONTENT */
    .main-content {
      margin-left: 240px;
      padding-top: 100px;
      padding-bottom: 80px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .profile-card {
      background: #fff;
      width: 90%;
      max-width: 400px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-align: center;
      animation: fadeIn 1s ease;
    }

    .header {
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      padding: 40px 20px 60px;
      position: relative;
    }

    .header h2 {
      color: white;
      letter-spacing: 1px;
    }

    .profile-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 5px solid white;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: -60px;
      object-fit: cover;
      background: #ccc;
    }

    .content {
      padding: 80px 20px 30px;
    }

    .name {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .info {
      color: #555;
      margin: 8px 0;
      font-size: 15px;
    }

    .info span {
      font-weight: bold;
      color: #333;
    }

    .btn {
      margin-top: 20px;
      display: inline-block;
      padding: 10px 20px;
      border-radius: 25px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      text-decoration: none;
      transition: 0.3s;
    }

    .btn:hover {
      opacity: 0.8;
    }

    /* FOOTER */
    footer {
      margin-left: 240px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 14px;
    }

    /* ANIMATION */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Responsive */
    @media (min-width: 768px) {
      .profile-card {
        max-width: 500px;
      }

      .name {
        font-size: 26px;
      }

      .info {
        font-size: 16px;
      }
    }

    @media (max-width: 768px) {

      .sidebar {
        width: 70px;
      }

      .sidebar ul li a span {
        display: none;
      }

      .sidebar ul li {
        text-align: center;
      }

      .main-content {
        margin-left: 70px;
      }

      footer {
        margin-left: 70px;
      }

      .profile-card {
        width: 95%;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="top-header">
    <div class="logo">My Dashboard</div>

    <div class="header-icons">
      <i class="bi bi-bell-fill"></i>
      <i class="bi bi-person-circle"></i>
    </div>
  </header>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <ul>

      <li>
        <a href="#">
          <i class="bi bi-house-door-fill"></i>
          <span>Home</span>
        </a>
      </li>

      <li>
        <a href="#">
          <i class="bi bi-person-fill"></i>
          <span>Profile</span>
        </a>
      </li>

      <li>
        <a href="#">
          <i class="bi bi-gear-fill"></i>
          <span>Settings</span>
        </a>
      </li>

      <li>
        <a href="#">
          <i class="bi bi-envelope-fill"></i>
          <span>Messages</span>
        </a>
      </li>

      <li>
        <a href="#">
          <i class="bi bi-box-arrow-right"></i>
          <span>Logout</span>
        </a>
      </li>

    </ul>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main-content">

    <div class="profile-card">
      
      <div class="header">
        <h2>My Profile</h2>
        <img src="dang.jpg" alt="Profile Picture" class="profile-img">
      </div>

      <div class="content">
        <div class="name">Christian Magallanes</div>

        <div class="info">
          <span>Birthday:</span> May 6, 2002
        </div>

        <div class="info">
          <span>Address:</span> Brgy. Oringao, Kabankalan City
        </div>

        <a href="#" class="btn">Follow</a>
      </div>

    </div>

  </div>

  <!-- FOOTER -->
  <footer>
    © 2026 My Profile Dashboard | All Rights Reserved
  </footer>

</body>
</html>
